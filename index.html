<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>COMPLETED Stamp Test (No White)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ===== 確認用背景 ===== */
    body {
      margin: 0;
      height: 100vh;
      background: #00ff00; /* 緑背景 */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== ハンコ本体 ===== */
    .stamp {
      position: relative;
      display: inline-block;
      padding: 20px 38px;
      border: 6px solid #c40000;
      transform: rotate(-12deg);
      opacity: 0.92;
      background: transparent;
    }

    /* 内枠 */
    .stamp::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 3px solid #c40000;
      pointer-events: none;
    }

    /* 文字 */
    .stamp span {
      position: relative;
      display: block;
      font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
      font-size: 52px;
      letter-spacing: 3px;
      color: #c40000;
      text-transform: uppercase;
      z-index: 1;
    }

    /* ===== 掠れ（白を描かない方式） ===== */
    .stamp::after {
      content: "";
      position: absolute;
      inset: -8px;

      /* 黒＝削る / 透明＝残す マスク */
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.25) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,0.22) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, rgba(0,0,0,0.18) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 25%, rgba(0,0,0,0.2) 0 2px, transparent 3px);

      background-size: 18px 18px;
      opacity: 0.45;

      /* ここが肝：色を足さず、削る */
      mix-blend-mode: destination-out;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="stamp">
    <span>COMPLETE</span>
  </div>

</body>
</html>
