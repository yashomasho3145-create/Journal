<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>COMPLETED Stamp Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ===== ページ全体（確認用背景） ===== */
    body {
      margin: 0;
      height: 100vh;
      background: #0a8f55; /* 緑背景で透過・重なり確認 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    /* ===== ハンコ全体 ===== */
    .stamp {
      position: relative;
      display: inline-block;
      padding: 20px 38px;
      border: 6px solid #c40000;
      transform: rotate(-12deg);
      opacity: 0.9;
      filter: contrast(1.1) saturate(1.1);
      background: transparent;
    }

    /* 内側の二重枠 */
    .stamp::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 3px solid #c40000;
      pointer-events: none;
    }

    /* 文字 */
    .stamp span {
      position: relative;
      display: block;
      font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
      font-size: 52px;
      letter-spacing: 3px;
      color: #c40000;
      text-transform: uppercase;

      /* インクのムラ・掠れ */
      text-shadow:
        1px 1px 0 rgba(150, 0, 0, 0.8),
        -1px -1px 0 rgba(150, 0, 0, 0.6),
        0 2px 1px rgba(0, 0, 0, 0.15);
    }

    /* 掠れドット（ハンコ感の決め手） */
    .stamp::after {
      content: "";
      position: absolute;
      inset: -10px;
      background-image:
        radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1px);
      background-size: 6px 6px;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- ===== ハンコ表示 ===== -->
  <div class="stamp">
    <span>COMPLETED</span>
  </div>

</body>
</html>
